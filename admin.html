<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理後台 — 雙效合一交易機器人</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    :root {
      --bg: #07111f;
      --card-bg: #101b2c;
      --card-inner: rgba(20,31,53,.8);
      --border: rgba(230,244,255,.12);
      --text: #eef8ff;
      --muted: #b2bfd5;
      --blue: #70f3ff;
      --green: #8affb4;
      --red: #ff7b92;
      --orange: #ffb86c;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px 80px;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .admin-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--blue);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .admin-nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-sm {
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
      color: var(--text);
      transition: all .2s;
    }
    .btn-sm:hover { background: rgba(255,255,255,.1); }
    .btn-danger {
      border-color: rgba(255,123,146,.4);
      color: var(--red);
    }
    .btn-danger:hover { background: rgba(255,123,146,.15); }
    .btn-primary {
      background: linear-gradient(135deg, var(--green), var(--blue));
      color: #07111f;
      border: none;
    }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }
    .stat-label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .stat-num { font-size: 26px; font-weight: 800; color: var(--blue); }
    .stat-num.green { color: var(--green); }
    .stat-num.orange { color: var(--orange); }

    /* Tabs */
    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .tab-btn {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
    }
    .tab-btn.active {
      background: rgba(112,243,255,.1);
      color: var(--blue);
    }

    /* Orders Section */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .filter-group { display: flex; gap: 8px; }
    .filter-tag {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .filter-tag.active {
      background: var(--blue);
      color: #07111f;
      border-color: var(--blue);
    }

    .table-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }
    th {
      padding: 14px 16px;
      background: rgba(20,31,53,.9);
      color: var(--muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(230,244,255,.06);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.02); }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }
    .badge-pending { background: rgba(255,184,108,.15); color: var(--orange); border: 1px solid rgba(255,184,108,.3); }
    .badge-approved { background: rgba(138,255,180,.15); color: var(--green); border: 1px solid rgba(138,255,180,.3); }
    .badge-rejected { background: rgba(255,123,146,.15); color: var(--red); border: 1px solid rgba(255,123,146,.3); }

    .screenshot-thumb {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      object-fit: cover;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: transform .2s;
    }
    .screenshot-thumb:hover { transform: scale(1.08); border-color: var(--blue); }
    .no-shot { font-size: 12px; color: var(--muted); font-style: italic; }

    .copy-pill {
      cursor: pointer;
      background: rgba(112,243,255,.08);
      color: var(--blue);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 12px;
      border: 1px solid rgba(112,243,255,.2);
      display: inline-block;
      margin-left: 4px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      max-width: 480px;
      width: 100%;
      padding: 30px;
      position: relative;
    }
    .modal-title { font-size: 20px; font-weight: 800; margin-bottom: 16px; color: var(--blue); }
    .form-row { margin-bottom: 16px; }
    .form-row label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .form-row input, .form-row select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--card-inner);
      color: var(--text);
      box-sizing: border-box;
      font-size: 14px;
    }
    .lightbox-img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,.8);
    }
  </style>
</head>
<body>

  <!-- 密碼登入彈窗 -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal-box">
      <div class="modal-title">🔒 管理後台身分驗證</div>
      <p style="color:var(--muted);font-size:14px;margin-bottom:20px;">請輸入管理員密碼以進入系統。</p>
      <form id="login-form">
        <div class="form-row">
          <label for="admin-pwd">管理員密碼</label>
          <input id="admin-pwd" type="password" placeholder="請輸入密碼" required autofocus />
        </div>
        <div id="login-err" style="color:var(--red);font-size:13px;margin-bottom:12px;"></div>
        <button type="submit" class="btn-sm btn-primary" style="width:100%;padding:12px;">登入後台</button>
      </form>
    </div>
  </div>

  <!-- 截圖放大燈箱 -->
  <div class="modal-overlay" id="lightbox-modal" onclick="closeLightbox()">
    <img id="lightbox-img" class="lightbox-img" src="" alt="交易截圖" />
  </div>

  <!-- 新增優惠碼彈窗 -->
  <div class="modal-overlay" id="promo-modal">
    <div class="modal-box">
      <div class="modal-title">🎟️ 新增優惠碼</div>
      <form id="create-promo-form">
        <div class="form-row">
          <label>優惠代碼（自動轉為大寫）</label>
          <input id="p-code" type="text" placeholder="例：VIP888" required />
        </div>
        <div class="form-row">
          <label>折扣類型</label>
          <select id="p-type">
            <option value="fixed">固定折抵金額 (USDT)</option>
            <option value="percent">百分比折扣 (%)</option>
          </select>
        </div>
        <div class="form-row">
          <label id="p-val-label">折抵金額 (USDT)</label>
          <input id="p-val" type="number" step="0.1" min="0.1" placeholder="例：10" required />
        </div>
        <div class="form-row">
          <label>適用方案</label>
          <select id="p-plan">
            <option value="all">全部方案通用</option>
            <option value="1M">僅限月費方案 (1M)</option>
            <option value="1Y">僅限年費方案 (1Y)</option>
          </select>
        </div>
        <div class="form-row">
          <label>最低購買份數門檻（買滿幾份才可折抵）</label>
          <input id="p-min-qty" type="number" min="1" value="1" placeholder="例：1 (代表 1 份起即可使用)" required />
        </div>
        <div class="form-row">
          <label>使用數量上限（名額限制）</label>
          <input id="p-max-uses" type="number" min="0" value="0" placeholder="填 0 或留空代表不限次數" />
        </div>
        <div style="display:flex;gap:10px;margin-top:20px;">
          <button type="button" class="btn-sm" style="flex:1;padding:10px;" onclick="closePromoModal()">取消</button>
          <button type="submit" class="btn-sm btn-primary" style="flex:1;padding:10px;">建立優惠碼</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 主頁面內容 -->
  <div class="admin-container" id="main-app" style="display:none;">
    <div class="admin-header">
      <div class="admin-title">⚡ 雙效合一交易機器人 · 後台管理系統</div>
      <div class="admin-nav-actions">
        <button class="btn-sm" onclick="loadData()">🔄 重新整理</button>
        <button class="btn-sm btn-danger" onclick="logout()">登出</button>
      </div>
    </div>

    <!-- 數據概覽 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">總訂單數</div>
        <div class="stat-num" id="st-total">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">待審核訂單</div>
        <div class="stat-num orange" id="st-pending">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">已通過訂單</div>
        <div class="stat-num green" id="st-approved">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">累積營收 (USDT)</div>
        <div class="stat-num green" id="st-revenue">0 U</div>
      </div>
    </div>

    <!-- 分頁按鈕 -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tab-btn-orders" onclick="switchTab('orders')">📋 訂單審核管理</button>
      <button class="tab-btn" id="tab-btn-promos" onclick="switchTab('promos')">🎟️ 優惠碼設定</button>
    </div>

    <!-- 分頁 1: 訂單審核 -->
    <div id="tab-orders">
      <div class="filter-bar">
        <div class="filter-group">
          <span class="filter-tag active" data-filter="all" onclick="setFilter('all')">全部 (<span id="cnt-all">0</span>)</span>
          <span class="filter-tag" data-filter="pending" onclick="setFilter('pending')">待審核 (<span id="cnt-pending">0</span>)</span>
          <span class="filter-tag" data-filter="approved" onclick="setFilter('approved')">已通過 (<span id="cnt-approved">0</span>)</span>
          <span class="filter-tag" data-filter="rejected" onclick="setFilter('rejected')">已拒絕 (<span id="cnt-rejected">0</span>)</span>
        </div>
      </div>

      <div class="table-box">
        <table>
          <thead>
            <tr>
              <th>訂單編號 / 時間</th>
              <th>付款人 / DC 帳號</th>
              <th>方案 / 數量</th>
              <th>鏈 / 金額</th>
              <th>優惠碼</th>
              <th>交易截圖</th>
              <th>審核狀態</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="orders-body">
            <tr><td colspan="8" style="text-align:center;color:var(--muted);padding:30px;">載入中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 分頁 2: 優惠碼設定 -->
    <div id="tab-promos" style="display:none;">
      <div class="filter-bar">
        <div style="font-size:16px;font-weight:700;">現有優惠碼清單</div>
        <button class="btn-sm btn-primary" onclick="openPromoModal()">+ 新增優惠碼</button>
      </div>

      <div class="table-box">
        <table>
          <thead>
            <tr>
              <th>優惠代碼</th>
              <th>折扣內容</th>
              <th>適用方案</th>
              <th>購買門檻</th>
              <th>使用進度 (已用 / 上限)</th>
              <th>目前狀態</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="promos-body">
            <tr><td colspan="7" style="text-align:center;color:var(--muted);padding:30px;">載入中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.protocol === 'file:' ? 'http://127.0.0.1:8001' : '';
    let adminToken = localStorage.getItem('admin_token') || '';
    let allOrders = [];
    let allPromos = [];
    let currentFilter = 'all';

    // --- 認證 ---
    function checkAuth() {
      if (!adminToken) {
        document.getElementById('login-modal').classList.add('show');
        document.getElementById('main-app').style.display = 'none';
      } else {
        document.getElementById('login-modal').classList.remove('show');
        document.getElementById('main-app').style.display = 'block';
        loadData();
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pwd = document.getElementById('admin-pwd').value.trim();
      const err = document.getElementById('login-err');
      err.textContent = '';
      try {
        const res = await fetch(`${API_BASE}/api/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd })
        });
        const d = await res.json();
        if (d.ok) {
          adminToken = d.token;
          localStorage.setItem('admin_token', adminToken);
          checkAuth();
        } else {
          err.textContent = d.message || '密碼錯誤';
        }
      } catch (e) {
        err.textContent = '連線失敗，請確認伺服器已啟動';
      }
    });

    function logout() {
      localStorage.removeItem('admin_token');
      adminToken = '';
      checkAuth();
    }

    // --- 載入資料 ---
    async function loadData() {
      try {
        const [ordRes, proRes] = await Promise.all([
          fetch(`${API_BASE}/api/admin/orders`, { headers: { 'X-Admin-Token': adminToken } }),
          fetch(`${API_BASE}/api/admin/promos`, { headers: { 'X-Admin-Token': adminToken } })
        ]);
        if (ordRes.status === 401 || proRes.status === 401) {
          logout();
          return;
        }
        const ordData = await ordRes.json();
        const proData = await proRes.json();
        allOrders = ordData.orders || [];
        allPromos = proData.promos || [];
        updateStats();
        renderOrders();
        renderPromos();
      } catch (err) {
        console.error('載入失敗:', err);
      }
    }

    function updateStats() {
      const total = allOrders.length;
      const pending = allOrders.filter(o => o.status === 'pending').length;
      const approved = allOrders.filter(o => o.status === 'approved').length;
      const rejected = allOrders.filter(o => o.status === 'rejected').length;
      const revenue = allOrders.filter(o => o.status === 'approved').reduce((sum, o) => sum + (o.amount || 0), 0);

      document.getElementById('st-total').textContent = total;
      document.getElementById('st-pending').textContent = pending;
      document.getElementById('st-approved').textContent = approved;
      document.getElementById('st-revenue').textContent = revenue.toFixed(1) + ' U';

      document.getElementById('cnt-all').textContent = total;
      document.getElementById('cnt-pending').textContent = pending;
      document.getElementById('cnt-approved').textContent = approved;
      document.getElementById('cnt-rejected').textContent = rejected;
    }

    // --- 訂單渲染 ---
    function renderOrders() {
      const tbody = document.getElementById('orders-body');
      let filtered = allOrders;
      if (currentFilter !== 'all') {
        filtered = allOrders.filter(o => o.status === currentFilter);
      }

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:30px;">尚無符合的訂單</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(o => {
        const dateStr = o.created_at ? new Date(o.created_at * 1000).toLocaleString('zh-TW', { hour12: false }) : '-';
        const planName = o.plan === '1Y' ? '年費' : '月費';
        const statusBadge = o.status === 'approved' 
          ? '<span class="badge badge-approved">已通過</span>'
          : o.status === 'rejected'
          ? '<span class="badge badge-rejected">已拒絕</span>'
          : '<span class="badge badge-pending">待審核</span>';

        const shotEl = o.screenshot 
          ? `<img class="screenshot-thumb" src="${o.screenshot}" alt="截圖" onclick="openLightbox('${o.screenshot}')" title="點擊放大查看" />`
          : '<span class="no-shot">未上傳</span>';

        const discountInfo = o.discount ? `<br><small style="color:var(--green);">折抵 -${o.discount}U</small>` : '';

        return `
          <tr>
            <td>
              <b style="color:var(--blue);">${o.order_id}</b><br>
              <small style="color:var(--muted);">${dateStr}</small>
            </td>
            <td>
              <b>${escapeHtml(o.name || '-')}</b><br>
              <span style="color:var(--muted);">DC: ${escapeHtml(o.contact || '-')}</span>
              <span class="copy-pill" onclick="copyText('${escapeHtml(o.contact || '')}')">複製</span>
            </td>
            <td>${planName} x ${o.quantity || 1}</td>
            <td>
              <span style="font-size:12px;color:var(--muted);">${o.network || 'BEP20'}</span><br>
              <b style="color:var(--green);">${o.amount} U</b>${discountInfo}
            </td>
            <td>${o.referral ? `<span style="color:var(--blue);font-weight:700;">${escapeHtml(o.referral)}</span>` : '<span style="color:var(--muted);">無</span>'}</td>
            <td>${shotEl}</td>
            <td>${statusBadge}</td>
            <td>
              <div style="display:flex;gap:6px;">
                <button class="btn-sm btn-primary" style="padding:4px 8px;font-size:12px;" onclick="updateOrderStatus('${o.order_id}', 'approved')">通過</button>
                <button class="btn-sm btn-danger" style="padding:4px 8px;font-size:12px;" onclick="updateOrderStatus('${o.order_id}', 'rejected')">拒絕</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function updateOrderStatus(orderId, status) {
      if (!confirm(`確定要將訂單 ${orderId} 標記為「${status === 'approved' ? '通過' : '拒絕'}」嗎？`)) return;
      try {
        const res = await fetch(`${API_BASE}/api/admin/orders/${orderId}/status`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Token': adminToken
          },
          body: JSON.stringify({ status })
        });
        const d = await res.json();
        if (d.ok) {
          loadData();
        } else {
          alert(d.message || '更新失敗');
        }
      } catch (err) {
        alert('操作失敗，伺服器無回應');
      }
    }

    // --- 優惠碼渲染 ---
    function renderPromos() {
      const tbody = document.getElementById('promos-body');
      if (allPromos.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:30px;">目前無優惠碼</td></tr>';
        return;
      }
      tbody.innerHTML = allPromos.map(p => {
        const desc = p.type === 'percent' ? `打 ${100 - p.value} 折 (${p.value}% OFF)` : `折抵 ${p.value} USDT`;
        
        let planBadge = '<span class="badge" style="background:rgba(56,189,248,.12);color:var(--blue);border:1px solid rgba(56,189,248,.25);">全部通用</span>';
        if (p.plan === '1M') {
          planBadge = '<span class="badge" style="background:rgba(251,191,36,.12);color:var(--orange);border:1px solid rgba(251,191,36,.25);">僅限月費</span>';
        } else if (p.plan === '1Y') {
          planBadge = '<span class="badge" style="background:rgba(167,139,250,.15);color:#c084fc;border:1px solid rgba(167,139,250,.3);">僅限年費</span>';
        }

        const minQty = p.min_qty || 1;
        const minQtyTxt = minQty > 1 ? `<b style="color:var(--orange);">滿 ${minQty} 份起</b>` : '<span style="color:var(--muted);">1 份起 (無門檻)</span>';

        const used = p.used_count || 0;
        const maxUses = p.max_uses || 0;
        let usageTxt = `${used} / 不限次數`;
        let isExhausted = false;
        if (maxUses > 0) {
          if (used >= maxUses) {
            usageTxt = `<span style="color:var(--red);font-weight:700;">${used} / ${maxUses} 次 (已額滿)</span>`;
            isExhausted = true;
          } else {
            usageTxt = `<span style="color:var(--blue);">${used}</span> / ${maxUses} 次`;
          }
        }

        let activeBadge = p.active 
          ? '<span class="badge badge-approved">已啟用</span>' 
          : '<span class="badge badge-rejected">已停用</span>';
        if (p.active && isExhausted) {
          activeBadge += ' <span class="badge badge-rejected" style="margin-left:4px;">已滿額</span>';
        }
        const toggleTxt = p.active ? '停用' : '啟用';

        return `
          <tr>
            <td><b style="color:var(--blue);font-size:16px;">${p.code}</b></td>
            <td>${desc}</td>
            <td>${planBadge}</td>
            <td>${minQtyTxt}</td>
            <td>${usageTxt}</td>
            <td>${activeBadge}</td>
            <td>
              <button class="btn-sm" style="margin-right:6px;" onclick="togglePromo('${p.code}')">${toggleTxt}</button>
              <button class="btn-sm btn-danger" onclick="deletePromo('${p.code}')">刪除</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function togglePromo(code) {
      await fetch(`${API_BASE}/api/admin/promos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
        body: JSON.stringify({ action: 'toggle', code })
      });
      loadData();
    }

    async function deletePromo(code) {
      if (!confirm(`確定要刪除優惠碼 ${code} 嗎？`)) return;
      await fetch(`${API_BASE}/api/admin/promos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
        body: JSON.stringify({ action: 'delete', code })
      });
      loadData();
    }

    // --- 優惠碼 Modal ---
    function openPromoModal() {
      document.getElementById('promo-modal').classList.add('show');
    }
    function closePromoModal() {
      document.getElementById('promo-modal').classList.remove('show');
    }
    document.getElementById('p-type').addEventListener('change', function() {
      const isPercent = this.value === 'percent';
      document.getElementById('p-val-label').textContent = isPercent ? '折扣趴數 (例 10 代表 9折/折10%)' : '折抵金額 (USDT)';
      document.getElementById('p-val').placeholder = isPercent ? '例：10' : '例：10';
    });
    document.getElementById('create-promo-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = document.getElementById('p-code').value.trim().toUpperCase();
      const type = document.getElementById('p-type').value;
      const value = parseFloat(document.getElementById('p-val').value);
      const plan = document.getElementById('p-plan').value;
      const min_qty = parseInt(document.getElementById('p-min-qty').value, 10) || 1;
      const max_uses = parseInt(document.getElementById('p-max-uses').value, 10) || 0;
      try {
        const res = await fetch(`${API_BASE}/api/admin/promos`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
          body: JSON.stringify({ action: 'create', code, type, value, plan, min_qty, max_uses })
        });
        const d = await res.json();
        if (d.ok) {
          closePromoModal();
          document.getElementById('create-promo-form').reset();
          document.getElementById('p-min-qty').value = '1';
          document.getElementById('p-max-uses').value = '0';
          loadData();
        } else {
          alert(d.message || '建立失敗');
        }
      } catch(err) {
        alert('建立失敗');
      }
    });

    // --- UI 互動與輔助 ---
    function switchTab(tab) {
      document.getElementById('tab-orders').style.display = tab === 'orders' ? 'block' : 'none';
      document.getElementById('tab-promos').style.display = tab === 'promos' ? 'block' : 'none';
      document.getElementById('tab-btn-orders').classList.toggle('active', tab === 'orders');
      document.getElementById('tab-btn-promos').classList.toggle('active', tab === 'promos');
    }

    function setFilter(f) {
      currentFilter = f;
      document.querySelectorAll('.filter-tag').forEach(el => {
        el.classList.toggle('active', el.dataset.filter === f);
      });
      renderOrders();
    }

    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox-modal').classList.add('show');
    }
    function closeLightbox() {
      document.getElementById('lightbox-modal').classList.remove('show');
    }

    function copyText(txt) {
      if (!txt) return;
      navigator.clipboard.writeText(txt).then(() => alert('已複製 DC 帳號: ' + txt));
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    checkAuth();
  </script>
</body>
</html>
